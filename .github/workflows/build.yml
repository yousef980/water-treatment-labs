name: Build Lab Suite EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib pyinstaller

    - name: Compile the Executable
      run: pyinstaller --onefile --noconsole lab_suite.py

    - name: Upload the EXE for Download
      uses: actions/upload-artifact@v4
      with:
        name: LabSuite-Windows
        path: dist/lab_suite.exe
