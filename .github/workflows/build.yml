name: Compile Unified Lab Suite

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install computing tools
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib pyinstaller

    - name: Compile master suite executable
      run: |
        pyinstaller --onefile app.py

    - name: Deliver executable package
      uses: actions/upload-artifact@v4
      with:
        name: Water-Treatment-Lab-Suite-Windows
        path: dist/app.exe
