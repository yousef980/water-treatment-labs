name: AQUALABS CI & BUILD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Validates mathematical formulas and libraries on a fast Linux instance
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib openpyxl

      - name: Check syntax (compile)
        run: python -m py_compile aqualabs_v2.py && echo "Syntax OK"

      - name: Run import smoke test
        run: |
          python - <<'EOF'
          import pandas as pd
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")   # headless — no display needed
          import matplotlib.pyplot as plt

          # Langmuir fit
          Ce  = np.array([0.82, 1.54, 2.91, 4.63, 6.78, 9.12, 12.35, 16.20, 20.87])
          qeL = np.array([0.13, 0.23, 0.40, 0.57, 0.74, 0.89,  1.04,  1.19,  1.31])
          y   = Ce / qeL
          sl, ic = np.polyfit(Ce, y, 1)
          qmax = 1 / sl
          b    = 1 / (ic * qmax)
          assert qmax > 0 and b > 0, "Langmuir fit failed"

          # Freundlich fit
          qeF = np.array([0.39, 0.49, 0.61, 0.72, 0.82, 0.91, 1.01, 1.12, 1.22])
          sl2, ic2 = np.polyfit(np.log(Ce), np.log(qeF), 1)
          Kf = np.exp(ic2)
          n  = 1 / sl2
          assert Kf > 0 and n > 0, "Freundlich fit failed"

          # TSS
          tss = ((1.2488 - 1.2435) * 1e6) / 100
          assert abs(tss - 53.0) < 1, "TSS calculation failed"

          print(f"Langmuir  → qmax={qmax:.3f} mg/g  b={b:.4f} L/mg")
          print(f"Freundlich → Kf={Kf:.4f}  n={n:.3f}")
          print(f"TSS        → {tss:.2f} mg/L")
          print("All assertions passed.")
          EOF

  # Job 2: Runs only if the mathematical test job passes, compiling on Windows
  build-windows:
    needs: test
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib openpyxl pyinstaller

      - name: Build Executable with PyInstaller
        # We switched to --onedir to prevent startup lag
        run: |
          pyinstaller --onedir --windowed --name=AquaLabs-v2 aqualabs_v2.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaLabs-v2-Windows
          path: dist/AquaLabs-v2
